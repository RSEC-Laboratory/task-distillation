[project]
name = "taskcompiler"
version = "0.1.0"
description = "Verified task compilation for frozen student language models"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.2.0",
    "datasets>=3.1.0",
    "hypothesis>=6.115.0",
    "psutil>=6.1.0",
    "pyyaml>=6.0.2",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
research = [
    "diskcache==5.6.3",
    "gepa==0.1.4",
    "graphviz==0.20.3",
    "platformdirs==4.3.8",
]
optimizers = [
    "dspy[optuna]==3.4.0",
    "litellm==1.90.0",
    "optuna==4.5.0",
]
benchmarks = [
    "absl-py==2.3.1",
    "langdetect==1.0.9",
    "nltk==3.9.2",
    "immutabledict==4.2.2",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
cache_dir = ".cache/pytest/cache"
addopts = ["--basetemp=.cache/pytest/tmp/default", "--junitxml=.cache/pytest/reports/pytest-default.xml"]
markers = ["model: integration test using real model weights; opt in with --run-model-tests"]
