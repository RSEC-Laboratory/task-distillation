[project]
name = "taskcompiler"
version = "0.1.0"
description = "Verified task compilation for frozen student language models"
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.40.0",
    "transformers>=4.46.0",
    "torch>=2.5.0",
    "sentence-transformers>=3.2.0",
    "datasets>=3.1.0",
    "hypothesis>=6.115.0",
    "psutil>=6.1.0",
    "pyyaml>=6.0.2",
    "streamlit>=1.40.0",
    "python-dotenv>=1.0.1",
    "numpy>=1.26.0",
    "requests>=2.32.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.3.0"]
research = [
    "diskcache==5.6.3",
    "gepa==0.1.4",
    "graphviz==0.20.3",
    "platformdirs==4.3.8",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
